name: Test Discord Notification

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send test message
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d '{"content":"🧪 LC Watcher 测试成功！如果你看到这条消息，说明 Discord 通知已经打通啦！🎉"}' \
            "$WEBHOOK"
